<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milk Shift Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true">M</span>
      <div>
        <h1>Milk Shift Manager</h1>
        <p>Shift Allotment Notice</p>
      </div>
    </div>
  </header>

  <main class="app">

    <!-- ===== Date ===== -->
    <section class="card">
      <div class="field">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" />
      </div>
    </section>

    <!-- ===== Employee assignments (dropdowns) ===== -->
    <section class="card">
      <div class="card-head">
        <h2>Assign Employees</h2>
        <span class="count-badge" id="assignedCount">0 assigned</span>
      </div>
      <div id="employeeList" class="employee-list">
        <!-- Rows are built by script.js from the EMPLOYEES array -->
      </div>
    </section>

    <!-- ===== Action buttons ===== -->
    <section class="actions">
      <button type="button" id="generateBtn" class="btn btn-primary">⚡ Generate Receipt</button>
      <div class="btn-row">
        <button type="button" id="downloadBtn" class="btn btn-primary">⬇ Download PNG</button>
        <button type="button" id="copyBtn" class="btn btn-ghost">Copy Text</button>
      </div>
      <div class="btn-row">
        <button type="button" id="yesterdayBtn" class="btn btn-ghost">⏪ Load Yesterday's Shift</button>
        <button type="button" id="clearBtn" class="btn btn-danger">Clear Assignments</button>
      </div>
    </section>

    <!-- ===== Live receipt preview ===== -->
    <section class="card preview-card">
      <div class="card-head">
        <h2>Receipt Preview</h2>
        <span class="live-dot" title="Updates automatically"></span>
      </div>
      <div class="preview-stage">
        <!-- This exact element is captured for PNG export -->
        <div id="receipt" class="receipt">
          <div id="receiptInner" class="receipt-inner"></div>
        </div>
      </div>
      <p class="preview-note">Download PNG and share it in your WhatsApp group.</p>
    </section>
  </main>

  <!-- Toast notifications -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- html2canvas (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- App logic -->
  <script src="script.js"></script>
</body>
</html>
